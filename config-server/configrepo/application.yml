jwt:
  secret: ${JWT_SECRET:change-me-local-dev-secret-32chars}

eureka:
  instance:
    prefer-ip-address: true

  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true

    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

  info:
    env:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    description: E-commerce microservice
    environment: ${SPRING_PROFILES_ACTIVE:default}