apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/component: payment
    app.kubernetes.io/part-of: ecommerce-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-service
      app.kubernetes.io/component: payment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-service
        app.kubernetes.io/component: payment
        app.kubernetes.io/part-of: ecommerce-microservices
    spec:
      containers:
        - name: payment-service
          image: ecommerce/payment-service:k8s-a91231c
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_CONFIG_IMPORT
              value: configserver:http://config-server:8888
            - name: CONFIG_SERVER_URL
              value: http://config-server:8888
            - name: EUREKA_DEFAULT_ZONE
              value: http://eureka-server:8761/eureka/
            - name: EUREKA_INSTANCE_HOSTNAME
              value: payment-service
            - name: PAYMENT_DB_URL
              value: jdbc:postgresql://host.docker.internal:5432/payment_db
            - name: PAYMENT_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: PAYMENT_DB_USERNAME
            - name: PAYMENT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: PAYMENT_DB_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: host.docker.internal:29093
          ports:
            - name: http
              containerPort: 8086
              protocol: TCP
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
