apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: config-server
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: ecommerce-microservices
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: config-server
    app.kubernetes.io/component: configuration
  ports:
    - name: http
      port: 8888
      targetPort: http
      protocol: TCP
