apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: customer-service
    app.kubernetes.io/component: customer
    app.kubernetes.io/part-of: ecommerce-microservices
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: customer-service
    app.kubernetes.io/component: customer
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
