  CUSTOMER_DB_PASSWORD: REPLACE_WITH_THE_CUSTOMER_DATABASE_PASSWORD
  ORDER_DB_USERNAME: REPLACE_WITH_THE_ORDER_DATABASE_USERNAME
  ORDER_DB_PASSWORD: REPLACE_WITH_THE_ORDER_DATABASE_PASSWORD
  INVENTORY_DB_USERNAME: REPLACE_WITH_THE_INVENTORY_DATABASE_USERNAME
  INVENTORY_DB_PASSWORD: REPLACE_WITH_THE_INVENTORY_DATABASE_PASSWORD
  PAYMENT_DB_USERNAME: REPLACE_WITH_THE_PAYMENT_DATABASE_USERNAME
  PAYMENT_DB_PASSWORD: REPLACE_WITH_THE_PAYMENT_DATABASE_PASSWORD
