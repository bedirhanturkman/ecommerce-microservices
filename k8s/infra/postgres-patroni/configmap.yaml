apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-patroni-config
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: postgres-patroni
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ecommerce
data:
  patroni.yml: |
    # The future StatefulSet must provide PATRONI_NAME and the pod-IP-based
    # PATRONI_RESTAPI_CONNECT_ADDRESS, PATRONI_POSTGRESQL_CONNECT_ADDRESS,
    # and PATRONI_KUBERNETES_POD_IP environment variables.
    # PATRONI_SUPERUSER_* and PATRONI_REPLICATION_* come from a Secret.
    scope: postgres-patroni
    namespace: ecommerce

    restapi:
      listen: 0.0.0.0:8008

    kubernetes:
      namespace: ecommerce
      use_endpoints: true
      labels:
        app.kubernetes.io/name: postgres-patroni
        cluster-name: postgres-patroni
      role_label: role
      leader_label_value: primary
      follower_label_value: replica
      ports:
        - name: postgresql
          port: 5432

    bootstrap:
      dcs:
        ttl: 30
        loop_wait: 10
        retry_timeout: 10
        maximum_lag_on_failover: 1048576
        postgresql:
          use_pg_rewind: true
          use_slots: true
          parameters:
            wal_level: replica
            hot_standby: "on"
            max_wal_senders: 10
            max_replication_slots: 10
            wal_keep_size: 256MB
            password_encryption: scram-sha-256
            wal_log_hints: "on"
      initdb:
        - encoding: UTF8
        - data-checksums

    postgresql:
      listen: 0.0.0.0:5432
      data_dir: /var/lib/postgresql/data
      bin_dir: /usr/lib/postgresql/17/bin
      pgpass: /var/lib/postgresql/.pgpass
      use_unix_socket: true
      parameters:
        unix_socket_directories: /var/run/postgresql
      pg_hba:
        - local all all scram-sha-256
        - host all all 127.0.0.1/32 scram-sha-256
        - host all all ::1/128 scram-sha-256
        - host replication replicator samenet scram-sha-256
        - host all all samenet scram-sha-256
