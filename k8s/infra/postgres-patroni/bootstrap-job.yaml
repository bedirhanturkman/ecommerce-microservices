apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-patroni-fresh-bootstrap
  namespace: ecommerce
  labels: {app.kubernetes.io/name: postgres-patroni, app.kubernetes.io/component: schema-bootstrap, app.kubernetes.io/part-of: ecommerce-microservices}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres-patroni, app.kubernetes.io/component: schema-bootstrap, app.kubernetes.io/part-of: ecommerce-microservices}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: bootstrap
          image: ecommerce-postgres-patroni:17-patroni-4.1.4
          imagePullPolicy: IfNotPresent
          command: [python3, /bootstrap/bootstrap.py]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          env:
            - {name: PATRONI_SUPERUSER_USERNAME, valueFrom: {secretKeyRef: {name: ecommerce-secrets, key: patroni-superuser-username}}}
            - {name: PATRONI_SUPERUSER_PASSWORD, valueFrom: {secretKeyRef: {name: ecommerce-secrets, key: patroni-superuser-password}}}
            - {name: CUSTOMER_DB_USERNAME, valueFrom: {secretKeyRef: {name: ecommerce-secrets, key: patroni-customer-db-username}}}
            - {name: CUSTOMER_DB_PASSWORD, valueFrom: {secretKeyRef: {name: ecommerce-secrets, key: patroni-customer-db-password}}}
            - {name: INVENTORY_DB_USERNAME, valueFrom: {secretKeyRef: {name: ecommerce-secrets, key: patroni-inventory-db-username}}}
            - {name: INVENTORY_DB_PASSWORD, valueFrom: {secretKeyRef: {name: ecommerce-secrets, key: patroni-inventory-db-password}}}
            - {name: PAYMENT_DB_USERNAME, valueFrom: {secretKeyRef: {name: ecommerce-secrets, key: patroni-payment-db-username}}}
            - {name: PAYMENT_DB_PASSWORD, valueFrom: {secretKeyRef: {name: ecommerce-secrets, key: patroni-payment-db-password}}}
            - {name: ORDER_DB_USERNAME, valueFrom: {secretKeyRef: {name: ecommerce-secrets, key: patroni-order-db-username}}}
            - {name: ORDER_DB_PASSWORD, valueFrom: {secretKeyRef: {name: ecommerce-secrets, key: patroni-order-db-password}}}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 256Mi}}
          volumeMounts: [{name: bootstrap, mountPath: /bootstrap, readOnly: true}]
      volumes: [{name: bootstrap, configMap: {name: postgres-patroni-fresh-bootstrap}}]
